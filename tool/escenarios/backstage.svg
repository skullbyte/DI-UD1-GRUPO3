    <pattern id="tablones" width="28" height="844" patternUnits="userSpaceOnUse"><rect width="1.5" height="844" fill="#000" fill-opacity="0.35"/></pattern>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
