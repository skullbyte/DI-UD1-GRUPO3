      <stop offset="0" stop-color="#1C100C"/><stop offset="0.6" stop-color="#120A0D"/><stop offset="1" stop-color="#0A0506"/>
    </linearGradient>
    <linearGradient id="zocalo" x1="0" y1="0" x2="0" y2="1">
